<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MAC Annual Event – Coming Soon</title>
<style>
  :root {
    --bg1: #0f172a;
    --bg2: #312e81;
    --accent: #fbbf24;
    --text: #f8fafc;
    --muted: #cbd5e1;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    background: linear-gradient(135deg, var(--bg1), var(--bg2));
    background-attachment: fixed;
    overflow-x: hidden;
  }
  body::before, body::after {
    content: "";
    position: fixed;
    border-radius: 50%;
    filter: blur(90px);
    opacity: .35;
    z-index: 0;
  }
  body::before { width: 420px; height: 420px; background: #6366f1; top: -120px; left: -120px; }
  body::after  { width: 380px; height: 380px; background: var(--accent); bottom: -140px; right: -100px; opacity: .2; }
  main { position: relative; z-index: 1; max-width: 720px; width: 100%; }
  .badge {
    display: inline-block;
    padding: 6px 16px;
    border: 1px solid rgba(251,191,36,.5);
    color: var(--accent);
    border-radius: 999px;
    font-size: .8rem;
    letter-spacing: .2em;
    text-transform: uppercase;
    margin-bottom: 24px;
  }
  h1 { font-size: clamp(2.4rem, 8vw, 4.5rem); line-height: 1.05; font-weight: 800; }
  h1 span { color: var(--accent); }
  p.sub { margin: 20px auto 40px; max-width: 480px; color: var(--muted); font-size: 1.1rem; line-height: 1.6; }
  .countdown { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .box {
    min-width: 80px;
    padding: 16px 12px;
    background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 14px;
    backdrop-filter: blur(8px);
  }
  .box b { display: block; font-size: 2rem; font-variant-numeric: tabular-nums; }
  .box small { color: var(--muted); font-size: .7rem; letter-spacing: .15em; text-transform: uppercase; }
  footer { margin-top: 48px; font-size: .85rem; color: var(--muted); }
</style>
</head>
<body>
<main>
  <div class="badge">Coming Soon</div>
  <h1>MAC <span>Annual Event</span></h1>
  <p class="sub">Something great is on the way. Stay tuned for the date, venue and agenda.</p>

  <div class="countdown" id="countdown" aria-live="off">
    <div class="box"><b id="d">--</b><small>Days</small></div>
    <div class="box"><b id="h">--</b><small>Hours</small></div>
    <div class="box"><b id="m">--</b><small>Minutes</small></div>
    <div class="box"><b id="s">--</b><small>Seconds</small></div>
  </div>

  <footer>&copy; <span id="yr"></span> MAC. All rights reserved.</footer>
</main>

<script>
  // Set the event date here (placeholder: ~60 days from page load until a real date is chosen).
  const EVENT_DATE = null; // e.g. new Date("2027-01-15T18:00:00")
  const target = EVENT_DATE || new Date(Date.now() + 60 * 864e5);

  const pad = n => String(n).padStart(2, "0");
  function tick() {
    const diff = Math.max(0, target - Date.now());
    d.textContent = pad(Math.floor(diff / 864e5));
    h.textContent = pad(Math.floor(diff / 36e5) % 24);
    m.textContent = pad(Math.floor(diff / 6e4) % 60);
    s.textContent = pad(Math.floor(diff / 1e3) % 60);
  }
  tick();
  setInterval(tick, 1000);
  document.getElementById("yr").textContent = new Date().getFullYear();
</script>
</body>
</html>
